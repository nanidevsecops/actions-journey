name: check context
on: push
jobs:
  chkcontxt:
    runs-on: ubuntu-latest
    steps:
      - name: print the vals
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "RunnerOS: ${{ runner.os }}"

